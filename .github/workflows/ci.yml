name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile-check all Python files
        run: |
          python -m py_compile deskbridge.py mcp_server.py core/activity_log.py core/chart_generator.py core/confirm.py core/desktop_control.py core/installer.py core/loader.py core/mcp_server.py wrappers/blender/actions.py wrappers/blender/cli.py wrappers/gimp/actions.py wrappers/gimp/cli.py wrappers/inkscape/actions.py wrappers/inkscape/cli.py wrappers/obsidian/actions.py wrappers/obsidian/cli.py wrappers/zotero/actions.py wrappers/zotero/cli.py hub/app.py hub/run_production.py tests/test_discovery.py

      - name: Run test suite
        run: |
          python tests/test_discovery.py
